    <style>
      /* ─── Reset ─────────────────────────────────────── */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: all 0.33s ease-in-out;
        text-wrap: pretty;
      }

      /* ─── Base ───────────────────────────────────────── */
      html,
      body {
        width: 300px;
        height: 600px;
        overflow: hidden;
        cursor: pointer;
        position: relative;
        z-index: 0;
      }
      body::after {
        content: '';
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 0 1px #d0d0d0;
        pointer-events: none;
        z-index: 9999;
        transition: background-color .33s ease-in-out;
      }

      /* ─── Variables ──────────────────────────────────── */
      :root {
        --c-ft: #1c1c1c;
        --c-fg: #4d4f53;
        --c-bg: #f8b73f;
        --c-hl: #fff;
        --font-size-heading: 37px;
        --font-size-tagline: 10px;
        --font-size-cta: 10px;
      }

      /* ─── Banner ─────────────────────────────────────── */
      .banner {
        position: relative;
        width: 300px;
        height: 600px;
        outline: 1px solid #d0d0d0;
        outline-offset: -1px;
        background-color: #eee;
        background-image: url('abra_bannerimg.jpg');
        background-repeat: no-repeat;
        background-size: cover;
        background-position: -80px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 16px;
        justify-content: center;
        padding: 8px 14px;
        -webkit-font-smoothing: antialiased;
        color: var(--c-ft);
        font-family: "Body", system-ui, sans-serif;
        font-size: var(--font-size-tagline);
        line-height: 1.5;
        letter-spacing: -0.01em;
      }
      .banner:hover {
        --c-ft: #1c1c1c;
        --c-fg: #1c1c1c;
        --c-bg: #fff;
        --c-hl: #f8b73f;
      }

      /* ─── Click area ─────────────────────────────────── */
      .click-area {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: block;
      }

      /* ─── Logo ───────────────────────────────────────── */
      .logo-slot {
        position: absolute;
        top: 14px;
        left: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 140px;
        background: var(--c-bg);
        padding: .35rem .5rem;
        border-radius: 2px;
      }

      /* ─── Footer ─────────────────────────────────────── */
      .footer svg {
        max-height: 0.9em;
        width: auto;
      }
      .bf {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--c-bg);
        padding: 8px 14px 16px;
        gap: 12px;
      }

      /* ─── SVG fills ──────────────────────────────────── */
      .c-yl { fill: var(--c-hl); }
      .c-gr { fill: var(--c-fg); }

      /* ─── Fields ─────────────────────────────────────── */
      [data-field="heading"] {
        position: relative;
        z-index: 3;
        font-size: var(--font-size-heading);
        line-height: 1.1;
      }
      [data-field="heading"] > span {
        background-color: var(--c-bg);
        padding: 2px 6px 3px;
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
      }
      [data-field="cta"] {
        font-size: var(--font-size-cta);
        background-color: var(--c-hl);
        padding: 8px 16px;
        border-radius: 32px;
      }

      .anim {
        opacity: 0;
        transform: translateY(6px);
        animation: fadeUp 0.45s ease forwards;
        animation-delay: var(--i);
      }
      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .banner:hover [data-field="cta"]  {
        text-decoration: underline;
      }
    </style>
  </head>
